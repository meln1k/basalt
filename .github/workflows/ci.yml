name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Fails unless clippy rejects a real clock read and other nondeterminism in core code.
      - run: ./ci/lint-canary.sh
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  # Runs a sample of seeds twice from the release binary, the build a deployment ships, and
  # fails if any seed's two runs end with different unseeds.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin basalt
      - run: target/release/basalt sim check-determinism --test ping-pong --seeds 0..200
      - run: target/release/basalt sim check-determinism --test faults --seeds 0..200
      - run: target/release/basalt sim check-determinism --test register --seeds 0..50
      # check-determinism passes a seed that fails the same way twice, so sweep for failures too.
      - run: target/release/basalt sim sweep --test register --seeds 0..200
