[package]
name = "basalt"
description = "The one shipped binary: basalt server and basalt sim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
basalt-harness = { path = "../basalt-harness" }
basalt-server = { path = "../basalt-server" }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
basalt-env = { path = "../basalt-env" }
basalt-rt = { path = "../basalt-rt" }
toy-register = { path = "../toy-register" }
