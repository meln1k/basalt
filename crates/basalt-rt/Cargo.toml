[package]
name = "basalt-rt"
description = "The production backend: executor loop, async-io reactor, file I/O pool, and compute pool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-io = "2.6.0"
basalt-env = { path = "../basalt-env" }
futures-io = "0.3.34"
rustix = { version = "1.1.6", features = ["fs", "rand"] }

[dev-dependencies]
rustix = { version = "1.1.6", features = ["net"] }

